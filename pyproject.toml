[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attention"]

[tool.hatch.build.targets.wheel.sources]
src = ""

[project]
name = "pyml-assignment-6"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Core ML
    "torch==2.11.0",
    "numpy==2.4.4",
    "matplotlib==3.10.9",
    "pyyaml==6.0.3",
    "tqdm==4.67.3",
    # QA
    "mypy==1.20.2",
    "ruff==0.15.12",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pre-commit==4.6.0",
]

[tool.ruff]
line-length = 150
# The two "find-and-fix" files are deliberately crafted so their bug line
# numbers are the graded contract (b_bug_lines / g_bug_line).  Never let a
# formatter reflow them.  force-exclude makes the exclude apply even when
# pre-commit passes the files explicitly.
exclude = [
    "*.md",
    "instructor_tools/train_buggy.py",
    "instructor_tools/masking_buggy.py",
]
force-exclude = true

[tool.ruff.lint]
ignore = [
    "E402", # module level import not at top of file
    "F401", # unused imports
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disable_error_code = [
    "empty-body",     # skeleton functions students must implement
    "attr-defined",   # skeleton classes missing student-implemented attributes
    "call-arg",       # skeleton __init__ signatures not yet written
    "call-overload",  # skeleton __iter__ not yet implemented
    "index",          # skeleton __getitem__ not yet implemented
    "arg-type",       # doctest examples and skeleton call sites
    "union-attr",     # submit.py infrastructure (spec may be None)
    "no-any-return",  # numpy operators return Any in stubs
    "import-untyped", # pyyaml has no bundled type stubs
]
